name: c3field deploy runtime proof

on:
  push:
    branches:
      - proof/deploy-7a97-runtime

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll registered Pages Function and My Env custom domain
        shell: bash
        run: |
          set -u
          probe() {
            url="$1"
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "URL=$url HTTP=$code"
            grep -Ei '^(cf-ray|server|content-type|cache-control|x-|etag):' "$headers" || true
            head -c 600 "$body" || true
            echo
            if [ "$code" = "401" ] && grep -q '"standing":"profile_pac_intake_held"' "$body"; then
              return 0
            fi
            return 1
          }

          for i in $(seq 1 12); do
            echo "attempt=$i"
            pages_ok=1
            custom_ok=1
            probe "https://c3-field-5qx.pages.dev/api/my-environment-profile" && pages_ok=0
            probe "https://my.c3field.online/api/my-environment-profile" && custom_ok=0
            if [ "$pages_ok" -eq 0 ] && [ "$custom_ok" -eq 0 ]; then
              echo "RUNTIME_PROOF=PASS"
              exit 0
            fi
            sleep 10
          done

          echo "RUNTIME_PROOF=HLD"
          exit 42
