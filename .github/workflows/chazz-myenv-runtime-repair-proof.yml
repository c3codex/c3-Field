name: Chazz My Env Runtime Repair Proof

on:
  push:
    branches:
      - proof/chazz-myenv-runtime-20260925

permissions:
  contents: read

jobs:
  prove-myenv-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair proof
        uses: actions/checkout@v4

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts

      - name: Prove Vite
        run: |
          test -x node_modules/.bin/vite
          ./node_modules/.bin/vite --version

      - name: Run bounded My Env tests
        run: node --import tsx --test functions/api/free-media.test.ts functions/api/my-environment-chazz.test.ts

      - name: Build c3field
        run: npm run build:c3field
