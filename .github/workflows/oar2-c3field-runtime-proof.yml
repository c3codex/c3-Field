name: OAR2 c3field runtime proof

on:
  push:
    branches:
      - oar2/envpac-root-profilepac-oye
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe registered Pages project, custom domains, and Dizzy
        shell: bash
        run: |
          set -u
          failed=0
          probe() {
            label="$1"
            url="$2"
            body="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$url" || true)"
            echo "=== $label ==="
            echo "url=$url"
            echo "http=$code"
            head -c 1200 "$body" || true
            echo
          }

          probe pages_profile https://c3-field-5qx.pages.dev/api/my-environment-profile
          probe custom_profile https://my.c3field.online/api/my-environment-profile
          probe c3field_root https://c3field.online/
          probe dizzy_health https://lapzuli-distribution-worker.c3field.workers.dev/health
