<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Lapis: relation / passage / continuity -->
  <!-- Three nodes: the three lapis-family places -->
  <circle cx="50" cy="20" r="5.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="24" cy="73" r="5.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="76" cy="73" r="5.5" stroke="currentColor" stroke-width="1.5"/>
  <!-- Connecting lines: the relation routes -->
  <line x1="46.5" y1="25" x2="28" y2="68" stroke="currentColor" stroke-width="1.5"/>
  <line x1="53.5" y1="25" x2="72" y2="68" stroke="currentColor" stroke-width="1.5"/>
  <line x1="29.5" y1="73" x2="70.5" y2="73" stroke="currentColor" stroke-width="1.5"/>
  <!-- Midpoint passage marks: the passage state along each route -->
  <circle cx="37" cy="46" r="2" stroke="currentColor" stroke-width="1" fill="currentColor" opacity="0.5"/>
  <circle cx="63" cy="46" r="2" stroke="currentColor" stroke-width="1" fill="currentColor" opacity="0.5"/>
  <circle cx="50" cy="73" r="2" stroke="currentColor" stroke-width="1" fill="currentColor" opacity="0.5"/>
</svg>
