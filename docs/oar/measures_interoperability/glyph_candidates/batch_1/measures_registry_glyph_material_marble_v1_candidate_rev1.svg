<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Marble: governed form / contract / Commerced Circuit — rev1 -->
  <!-- Outer circle: governing boundary -->
  <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-width="1.5"/>
  <!-- Inner circle: contract core -->
  <circle cx="50" cy="50" r="23" stroke="currentColor" stroke-width="1.5"/>
  <!-- Inner diamond: seated within contract core (r=19 — inside the inner circle) -->
  <polygon points="50,31 69,50 50,69 31,50" stroke="currentColor" stroke-width="1"/>
  <!-- Cardinal marks: short rim ticks at 4 governance axes (reduced dominance) -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="currentColor" stroke-width="1.5"/>
  <line x1="88" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="80" stroke="currentColor" stroke-width="1.5"/>
  <line x1="12" y1="50" x2="20" y2="50" stroke="currentColor" stroke-width="1.5"/>
</svg>
