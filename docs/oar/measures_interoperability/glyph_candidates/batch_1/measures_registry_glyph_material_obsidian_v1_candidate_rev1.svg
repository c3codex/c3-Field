<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Obsidian: assessment / drift exposure / reduction — rev1 -->
  <!-- Outer diamond: precision assessment perimeter -->
  <polygon points="50,12 88,50 50,88 12,50" stroke="currentColor" stroke-width="1.5"/>
  <!-- Inner diamond: narrower and taller — the obsidian cut form, drift reduced -->
  <polygon points="50,22 68,50 50,78 32,50" stroke="currentColor" stroke-width="1.5"/>
  <!-- Vertical reduction axis: fine, low opacity -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="currentColor" stroke-width="0.75" opacity="0.25"/>
  <!-- Narrowing gate / threshold cut: converging lines in lower inner field -->
  <line x1="43" y1="55" x2="50" y2="67" stroke="currentColor" stroke-width="1.25"/>
  <line x1="57" y1="55" x2="50" y2="67" stroke="currentColor" stroke-width="1.25"/>
</svg>
