<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- c3 MAP: recognition / assessment protocol -->
  <!-- Outer circle: the protocol boundary and crystal clarity frame -->
  <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="1.5"/>
  <!-- Cross-axes: the full measurement framework (H + V) -->
  <line x1="15" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="1"/>
  <line x1="50" y1="15" x2="50" y2="85" stroke="currentColor" stroke-width="1"/>
  <!-- Diagonal edge marks: 8-direction assessment coverage — short, secondary weight -->
  <!-- Each mark runs from ~60% radius inward to the circle edge at 45° intervals -->
  <line x1="65" y1="35" x2="75" y2="25" stroke="currentColor" stroke-width="0.75" opacity="0.7"/>
  <line x1="35" y1="35" x2="25" y2="25" stroke="currentColor" stroke-width="0.75" opacity="0.7"/>
  <line x1="65" y1="65" x2="75" y2="75" stroke="currentColor" stroke-width="0.75" opacity="0.7"/>
  <line x1="35" y1="65" x2="25" y2="75" stroke="currentColor" stroke-width="0.75" opacity="0.7"/>
</svg>
