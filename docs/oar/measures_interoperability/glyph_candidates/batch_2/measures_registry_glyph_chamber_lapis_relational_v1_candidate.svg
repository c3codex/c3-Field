  <circle cx="22" cy="52" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="78" cy="52" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="50" cy="80" r="4" stroke="currentColor" stroke-width="1.5"/>
  <!-- Relational routes: diamond perimeter connections -->
  <line x1="47" y1="24" x2="25" y2="49" stroke="currentColor" stroke-width="1.5"/>
  <line x1="53" y1="24" x2="75" y2="49" stroke="currentColor" stroke-width="1.5"/>
  <line x1="25" y1="56" x2="47" y2="77" stroke="currentColor" stroke-width="1.5"/>
  <line x1="75" y1="56" x2="53" y2="77" stroke="currentColor" stroke-width="1.5"/>
  <!-- Horizontal orientation axis: the editorial field anchor -->
  <line x1="26" y1="52" x2="74" y2="52" stroke="currentColor" stroke-width="0.75" opacity="0.6"/>
