<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Obsidian Assessment Gate: diagnostic readiness / drift gate -->
  <!-- Shield / gate pentagon: the diagnostic boundary -->
  <polygon points="25,24 75,24 75,58 50,82 25,58" stroke="currentColor" stroke-width="1.5"/>
  <!-- Interior diagnostic line: the assessment threshold / gate bar -->
  <line x1="38" y1="43" x2="62" y2="43" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Narrowing gate mark (inherited from obsidian material): reduction point inside gate -->
  <line x1="44" y1="54" x2="50" y2="63" stroke="currentColor" stroke-width="1"/>
  <line x1="56" y1="54" x2="50" y2="63" stroke="currentColor" stroke-width="1"/>
</svg>
