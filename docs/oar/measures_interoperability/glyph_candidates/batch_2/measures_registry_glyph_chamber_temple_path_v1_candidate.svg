<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Temple Path: path choice / evaluate / structure -->
  <!-- Stem: the shared origin before the fork -->
  <line x1="50" y1="78" x2="50" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <!-- Left branch: Assess the Environment path -->
  <line x1="50" y1="52" x2="28" y2="24" stroke="currentColor" stroke-width="1.5"/>
  <!-- Right branch: Structure the Environment path -->
  <line x1="50" y1="52" x2="72" y2="24" stroke="currentColor" stroke-width="1.5"/>
  <!-- Left terminal cap: the destination mark — equal weight -->
  <line x1="22" y1="24" x2="34" y2="24" stroke="currentColor" stroke-width="1.5"/>
  <!-- Right terminal cap: equal weight, equal destination -->
  <line x1="66" y1="24" x2="78" y2="24" stroke="currentColor" stroke-width="1.5"/>
</svg>
