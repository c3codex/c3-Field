<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Marble Commerced Circuit: governed commerce / circuit tier readiness -->
  <!-- Outer circle: Marble governed boundary -->
  <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="1.5"/>
  <!-- Inner diamond: seated qualified asset — governed form inside the circuit boundary -->
  <polygon points="50,30 70,50 50,70 30,50" stroke="currentColor" stroke-width="1"/>
  <!-- Three circuit tier marks: inward ticks at 120° — C1 / C2 / C3 positions on the governed boundary -->
  <line x1="50" y1="15" x2="50" y2="22" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="80" y1="68" x2="74" y2="64" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="20" y1="68" x2="26" y2="64" stroke="currentColor" stroke-width="1" opacity="0.7"/>
</svg>
