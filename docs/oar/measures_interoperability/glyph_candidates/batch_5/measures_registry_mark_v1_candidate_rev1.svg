<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Measures Registry brand mark rev1: measurement identity — quiet boundary, visible structure -->
  <!-- Outer circle: governing context — light presence, not a seal boundary -->
  <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="1" opacity="0.6"/>
  <!-- Horizontal measurement axis: the primary visible structure — this is what the Registry does -->
  <line x1="22" y1="50" x2="78" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <!-- Center calibration mark: primary measurement reference point -->
  <line x1="50" y1="44" x2="50" y2="56" stroke="currentColor" stroke-width="1"/>
  <!-- Side calibration marks: equal measurement intervals -->
  <line x1="34" y1="46" x2="34" y2="54" stroke="currentColor" stroke-width="1"/>
  <line x1="66" y1="46" x2="66" y2="54" stroke="currentColor" stroke-width="1"/>
</svg>
