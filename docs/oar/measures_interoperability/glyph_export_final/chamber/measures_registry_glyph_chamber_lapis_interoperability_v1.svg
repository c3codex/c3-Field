<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Lapis Interoperability rev1: governed route continuity across connected systems -->
  <!-- Upper system route: extends well past bridge zone on both sides — continuous, not bounded -->
  <line x1="10" y1="37" x2="90" y2="37" stroke="currentColor" stroke-width="1.5"/>
  <!-- Lower system route: same continuity emphasis -->
  <line x1="10" y1="63" x2="90" y2="63" stroke="currentColor" stroke-width="1.5"/>
  <!-- Left interoperability bridge: the connection zone -->
  <line x1="32" y1="37" x2="32" y2="63" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Right interoperability bridge -->
  <line x1="68" y1="37" x2="68" y2="63" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Waypoint nodes at bridge-route intersections: Lapis passage indicators -->
  <circle cx="32" cy="37" r="2.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="68" cy="37" r="2.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="32" cy="63" r="2.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="68" cy="63" r="2.5" stroke="currentColor" stroke-width="1"/>
</svg>
