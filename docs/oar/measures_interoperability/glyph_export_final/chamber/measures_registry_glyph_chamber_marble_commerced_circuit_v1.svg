<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Marble Commerced Circuit rev1: governed commerce / distributed circuit tier positions -->
  <!-- Outer circle: Marble governed boundary -->
  <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="1.5"/>
  <!-- Three boundary access marks: inward ticks at 120° — entry points for the three circuit tiers -->
  <line x1="50" y1="15" x2="50" y2="22" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="80" y1="68" x2="74" y2="64" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <line x1="20" y1="68" x2="26" y2="64" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Three circuit tier nodes: C1 / C2 / C3 positions distributed inside the governed boundary -->
  <circle cx="50" cy="28" r="3" stroke="currentColor" stroke-width="1" opacity="0.75"/>
  <circle cx="69" cy="61" r="3" stroke="currentColor" stroke-width="1" opacity="0.75"/>
  <circle cx="31" cy="61" r="3" stroke="currentColor" stroke-width="1" opacity="0.75"/>
</svg>
