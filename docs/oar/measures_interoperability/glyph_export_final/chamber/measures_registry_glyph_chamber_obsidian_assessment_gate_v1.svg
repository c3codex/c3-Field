<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Obsidian Assessment Gate rev1: gate / aperture / threshold — not shield -->
  <!-- Left pillar: passage boundary -->
  <line x1="34" y1="22" x2="34" y2="78" stroke="currentColor" stroke-width="1.5"/>
  <!-- Right pillar: passage boundary -->
  <line x1="66" y1="22" x2="66" y2="78" stroke="currentColor" stroke-width="1.5"/>
  <!-- Header: the entry threshold — gate lintel, top of the passage -->
  <line x1="34" y1="22" x2="66" y2="22" stroke="currentColor" stroke-width="1.5"/>
  <!-- Interior diagnostic line: assessment threshold inside the passage -->
  <line x1="40" y1="42" x2="60" y2="42" stroke="currentColor" stroke-width="1" opacity="0.7"/>
  <!-- Narrowing gate mark (obsidian material): drift reduction point in the lower passage -->
  <line x1="43" y1="55" x2="50" y2="67" stroke="currentColor" stroke-width="1"/>
  <line x1="57" y1="55" x2="50" y2="67" stroke="currentColor" stroke-width="1"/>
</svg>
